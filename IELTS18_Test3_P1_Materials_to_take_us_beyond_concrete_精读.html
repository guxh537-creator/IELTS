<script type="application/json" id="study-data">{"title": "Materials to take us beyond concrete", "subtitle": "Concrete is everywhere, but it's bad for the planet, generating large amounts of carbon dioxide – alternatives are being developed", "sections": [{"id": "A", "full_en": "Concrete is the second most used substance in the global economy, after water – and one of the world's biggest single sources of greenhouse gas emissions. The chemical process by which cement, the key ingredient of concrete, is created results in large quantities of carbon dioxide. The UN estimates that there will be 9.8 billion people living on the planet by mid-century. They will need somewhere to live. If concrete is the only answer to the construction of new cities, then carbon emissions will soar, aggravating global warming. And so scientists have started innovating with other materials, in a scramble for alternatives to a universal commodity that has underpinned our modern life for many years.", "sentences": [{"en": "Concrete is the second most used substance in the global economy, after water – and one of the world's biggest single sources of greenhouse gas emissions.", "cn": "混凝土是全球经济中使用量仅次于水的物质，也是全球最大的单一温室气体排放来源之一。", "grammar": "second most used：使用量第二；after water＝仅次于水。"}, {"en": "The chemical process by which cement, the key ingredient of concrete, is created results in large quantities of carbon dioxide.", "cn": "生产水泥这一混凝土关键成分的化学过程，会产生大量二氧化碳。", "grammar": "by which 引导定语从句修饰 process；result in＝导致。"}, {"en": "The UN estimates that there will be 9.8 billion people living on the planet by mid-century.", "cn": "联合国估计，到本世纪中叶，地球上将有98亿人口。", "grammar": "estimates that 后接宾语从句；by mid-century＝到本世纪中叶。"}, {"en": "They will need somewhere to live.", "cn": "他们需要居住的地方。", "grammar": "They 指前句中的人口。"}, {"en": "If concrete is the only answer to the construction of new cities, then carbon emissions will soar, aggravating global warming.", "cn": "如果建设新城市只能依赖混凝土，碳排放就会猛增，从而加剧全球变暖。", "grammar": "If...then... 表条件与结果；soar＝猛增；aggravating 表进一步后果。"}, {"en": "And so scientists have started innovating with other materials, in a scramble for alternatives to a universal commodity that has underpinned our modern life for many years.", "cn": "因此，科学家开始尝试其他材料，争相为这种多年来支撑现代生活的普遍商品寻找替代品。", "grammar": "in a scramble for＝争相寻找；that has underpinned... 修饰 commodity。"}]}, {"id": "B", "full_en": "The problem with replacing concrete is that it is so very good at what it does. Chris Cheeseman, an engineering professor at Imperial College London, says the key thing to consider is the extent to which concrete is used around the world, and is likely to continue to be used. 'Concrete is not a high-carbon product. Cement is high carbon, but concrete is not. But it is the scale on which it is used that makes it high carbon. The sheer scale of manufacture is so huge, that is the issue.'", "sentences": [{"en": "The problem with replacing concrete is that it is so very good at what it does.", "cn": "替代混凝土的难题在于，它非常擅长发挥自身的作用。", "grammar": "The problem ... is that...＝问题在于……。"}, {"en": "Chris Cheeseman, an engineering professor at Imperial College London, says the key thing to consider is the extent to which concrete is used around the world, and is likely to continue to be used.", "cn": "伦敦帝国理工学院工程学教授克里斯·奇斯曼表示，关键是考虑混凝土目前在全球的使用程度，以及未来可能继续使用的程度。", "grammar": "the extent to which＝……的程度；is likely to＝可能会。"}, {"en": "'Concrete is not a high-carbon product.", "cn": "‘混凝土本身并不是高碳产品。", "grammar": "不是在否认整个行业的排碳问题。"}, {"en": "Cement is high carbon, but concrete is not.", "cn": "水泥是高碳产品，但混凝土并不是。", "grammar": "cement（水泥）和 concrete（混凝土）需区分。"}, {"en": "But it is the scale on which it is used that makes it high carbon.", "cn": "但正是它的巨大使用规模使它造成高碳影响。", "grammar": "it is ... that... 是强调句；scale＝规模。"}, {"en": "The sheer scale of manufacture is so huge, that is the issue.'", "cn": "制造规模实在太庞大了，这才是问题所在。’", "grammar": "sheer 用于强调程度；manufacture＝制造。"}]}, {"id": "C", "full_en": "Not only are the ingredients of concrete relatively cheap and found in abundance in most places around the globe, the stuff itself has marvellous properties: Portland cement, the vital component of concrete, is mouldable and pourable, but quickly sets hard. Cheeseman also notes another advantage: concrete and steel have similar thermal expansion properties, so steel can be used to reinforce concrete, making it far stronger and more flexible as a building material than it could be on its own. According to Cheeseman, all these factors together make concrete hard to beat. 'Concrete is amazing stuff. Making anything with similar properties is going to be very difficult.'", "sentences": [{"en": "Not only are the ingredients of concrete relatively cheap and found in abundance in most places around the globe, the stuff itself has marvellous properties: Portland cement, the vital component of concrete, is mouldable and pourable, but quickly sets hard.", "cn": "混凝土的原料不仅相对便宜，而且在全球大部分地方都很丰富；这种材料本身还有出色的性能：作为关键成分的波特兰水泥可塑形、可浇筑，却又能迅速凝固变硬。", "grammar": "Not only 置于句首引起倒装；found in abundance＝大量存在；sets hard＝凝固变硬。"}, {"en": "Cheeseman also notes another advantage: concrete and steel have similar thermal expansion properties, so steel can be used to reinforce concrete, making it far stronger and more flexible as a building material than it could be on its own.", "cn": "奇斯曼还指出另一项优势：混凝土与钢材的热膨胀性质相近，因此可以用钢筋加固混凝土，让它比单独使用时更坚固、更灵活。", "grammar": "so＝因果；reinforce＝加固；making... 补充结果。"}, {"en": "According to Cheeseman, all these factors together make concrete hard to beat.", "cn": "奇斯曼认为，这些因素加起来使混凝土很难被超越。", "grammar": "make + 宾语 + 形容词；hard to beat＝难以超越。"}, {"en": "'Concrete is amazing stuff.", "cn": "‘混凝土是很出色的材料。", "grammar": "stuff 在此指材料，属于较口语的用法。"}, {"en": "Making anything with similar properties is going to be very difficult.'", "cn": "要制造出拥有类似性能的其他材料会非常困难。’", "grammar": "Making... 动名词短语作主语；similar properties＝相似性能。"}]}, {"id": "D", "full_en": "A possible alternative to concrete is wood. Making buildings from wood may seem like a rather medieval idea, but climate change is driving architects to turn to treated timber as a possible resource. Recent years have seen the emergence of tall buildings constructed almost entirely from timber. Vancouver, Vienna and Brumunddal in Norway are all home to constructed tall, wooden buildings.", "sentences": [{"en": "A possible alternative to concrete is wood.", "cn": "混凝土的一种可能替代材料是木材。", "grammar": "alternative to＝……的替代品。"}, {"en": "Making buildings from wood may seem like a rather medieval idea, but climate change is driving architects to turn to treated timber as a possible resource.", "cn": "用木材建造房屋似乎是相当中世纪的想法，但气候变化正促使建筑师转向经过处理的木材，将其视为一种可能的建筑资源。", "grammar": "drive sb. to do＝促使某人做；treated timber＝经处理的木材。"}, {"en": "Recent years have seen the emergence of tall buildings constructed almost entirely from timber.", "cn": "近些年出现了几乎完全由木材建造的高层建筑。", "grammar": "Recent years have seen...＝近年出现了……；constructed... 是过去分词后置修饰。"}, {"en": "Vancouver, Vienna and Brumunddal in Norway are all home to constructed tall, wooden buildings.", "cn": "温哥华、维也纳和挪威的布鲁蒙达尔都有已经建成的木结构高层建筑。", "grammar": "be home to＝是……的所在地；Q2 对应具体地点。"}]}, {"id": "E", "full_en": "Using wood to construct buildings, however, is not straightforward. Wood expands as it absorbs moisture from the air and is susceptible to pests, not to mention fire. But treating wood and combining it with other materials can improve its properties. Cross-laminated timber is engineered wood. An adhesive is used to stick layers of solid-sawn timber together, crosswise, to form building blocks. This material is light but has the strength of concrete and steel. Construction experts say that wooden buildings can be constructed at a greater speed than ones of concrete and steel and the process, it seems, is quieter.", "sentences": [{"en": "Using wood to construct buildings, however, is not straightforward.", "cn": "然而，使用木材建造建筑并非那么简单。", "grammar": "Using wood... 动名词短语作主语；not straightforward＝并不简单。"}, {"en": "Wood expands as it absorbs moisture from the air and is susceptible to pests, not to mention fire.", "cn": "木材吸收空气中的水分时会膨胀，也容易遭受虫害，更不用说火灾风险。", "grammar": "as＝随着/当……时；susceptible to＝易受……影响；not to mention＝更不用说。"}, {"en": "But treating wood and combining it with other materials can improve its properties.", "cn": "不过，对木材进行处理并与其他材料结合，可以改善它的性能。", "grammar": "treating 和 combining 为并列动名词短语。"}, {"en": "Cross-laminated timber is engineered wood.", "cn": "交叉层压木材是一种工程木材。", "grammar": "engineered wood＝经过工程加工的木质材料。"}, {"en": "An adhesive is used to stick layers of solid-sawn timber together, crosswise, to form building blocks.", "cn": "用黏合剂把多层实锯木材交叉粘合在一起，形成建筑用的块状构件。", "grammar": "An adhesive is used to... 被动结构；layers＝层；crosswise＝交叉地。"}, {"en": "This material is light but has the strength of concrete and steel.", "cn": "这种材料很轻，但强度可媲美混凝土和钢材。", "grammar": "light but... 对比轻便与强度。"}, {"en": "Construction experts say that wooden buildings can be constructed at a greater speed than ones of concrete and steel and the process, it seems, is quieter.", "cn": "建筑专家认为，木结构建筑的施工速度可以比混凝土和钢结构建筑更快，而且施工过程似乎也更安静。", "grammar": "at a greater speed＝以更快速度；quieter＝噪声更小。"}]}, {"id": "F", "full_en": "Stora Enso is Europe's biggest supplier of cross-laminated timber, and its vice-president Markus Mannström reports that the company is seeing increasing demand globally for building in wood, with climate change concerns the key driver. Finland, with its large forests, where Stora Enso is based, has been leading the way, but the company is seeing a rise in demand for its timber products across the world, including in Asia. Of course, using timber in a building also locks away the carbon that it absorbed as it grew. But even treated wood has its limitations and only when a wider range of construction projects has been proven in practice will it be possible to see wood as a real alternative to concrete in constructing tall buildings.", "sentences": [{"en": "Stora Enso is Europe's biggest supplier of cross-laminated timber, and its vice-president Markus Mannström reports that the company is seeing increasing demand globally for building in wood, with climate change concerns the key driver.", "cn": "Stora Enso 是欧洲最大的交叉层压木材供应商，其副总裁马库斯·曼斯特伦表示，全球对木结构建筑的需求正在增长，关键推动力是对气候变化的担忧。", "grammar": "demand for＝对……的需求；with... the key driver＝以……为主要推动力。"}, {"en": "Finland, with its large forests, where Stora Enso is based, has been leading the way, but the company is seeing a rise in demand for its timber products across the world, including in Asia.", "cn": "拥有大片森林、也是 Stora Enso 总部所在地的芬兰一直走在前列，但公司发现全球包括亚洲在内，对其木材产品的需求都在上升。", "grammar": "where... 引导定语从句；leading the way＝走在前列。"}, {"en": "Of course, using timber in a building also locks away the carbon that it absorbed as it grew.", "cn": "当然，在建筑中使用木材还能储存树木生长时吸收的碳。", "grammar": "lock away＝封存；that it absorbed 为修饰 carbon 的定语从句。"}, {"en": "But even treated wood has its limitations and only when a wider range of construction projects has been proven in practice will it be possible to see wood as a real alternative to concrete in constructing tall buildings.", "cn": "但即使是经过处理的木材也有局限；只有更多类型的建筑项目得到实践验证之后，才可能把木材视为建造高层建筑时真正可行的混凝土替代品。", "grammar": "only when 置于句首，主句需部分倒装 will it be possible；Q4 核心定位句。"}]}, {"id": "G", "full_en": "Fly ash and slag from iron ore are possible alternatives to cement in a concrete mix. Fly ash, a byproduct of coal-burning power plants, can be incorporated into concrete mixes to make up as much as 15 to 30% of the cement, without harming the strength or durability of the resulting mix. Iron-ore slag, a byproduct of the iron-ore smelting process, can be used in a similar way. Their incorporation into concrete mixes has the potential to reduce greenhouse gas emissions. But Anna Surgenor, of the UK's Green Building Council, notes that although these waste products can save carbon in the concrete mix, their use is not always straightforward. 'It's possible to replace the cement content in concrete with waste products to lower the overall carbon impact. But there are several calculations that need to be considered across the entire life cycle of the building – these include factoring in where these materials are being shipped from. If they are transported over long distances, using fossil fuels, the use of alternative materials might not make sense from an overall carbon reduction perspective.'", "sentences": [{"en": "Fly ash and slag from iron ore are possible alternatives to cement in a concrete mix.", "cn": "粉煤灰和铁矿石冶炼得到的矿渣，是混凝土配料中水泥的潜在替代物。", "grammar": "fly ash＝粉煤灰；slag＝矿渣；alternatives to cement＝水泥替代材料。"}, {"en": "Fly ash, a byproduct of coal-burning power plants, can be incorporated into concrete mixes to make up as much as 15 to 30% of the cement, without harming the strength or durability of the resulting mix.", "cn": "粉煤灰是燃煤电厂的副产品，可掺入混凝土配料中，替代多达15%至30%的水泥，同时不损害成品的强度或耐久性。", "grammar": "a byproduct of... 为同位语；without harming＝不会损害。"}, {"en": "Iron-ore slag, a byproduct of the iron-ore smelting process, can be used in a similar way.", "cn": "矿渣是铁矿石冶炼过程的副产品，也可以用类似方式使用。", "grammar": "smelting process＝冶炼过程；Q1 直接定位。"}, {"en": "Their incorporation into concrete mixes has the potential to reduce greenhouse gas emissions.", "cn": "把这些材料掺入混凝土有望减少温室气体排放。", "grammar": "has the potential to＝有潜力，并非必然。"}, {"en": "But Anna Surgenor, of the UK's Green Building Council, notes that although these waste products can save carbon in the concrete mix, their use is not always straightforward.", "cn": "但英国绿色建筑委员会的安娜·瑟吉纳指出，尽管这些废弃副产品能减少混凝土配料的碳排放，使用它们却并非总是简单可行。", "grammar": "although 引导让步；not always＝并非总是。"}, {"en": "'It's possible to replace the cement content in concrete with waste products to lower the overall carbon impact.", "cn": "‘可以用废弃副产品替代混凝土中的水泥，以降低总体碳影响。", "grammar": "replace A with B＝用 B 替代 A。"}, {"en": "But there are several calculations that need to be considered across the entire life cycle of the building – these include factoring in where these materials are being shipped from.", "cn": "但需要在建筑物的整个生命周期中考虑多项计算，包括这些材料从哪里运来。", "grammar": "entire life cycle＝全生命周期；factor in＝将……计入。"}, {"en": "If they are transported over long distances, using fossil fuels, the use of alternative materials might not make sense from an overall carbon reduction perspective.'", "cn": "如果用化石燃料把材料远距离运来，那么从整体减碳角度看，使用替代材料可能并不划算。’", "grammar": "If...might not＝有条件的不确定判断；Q9 关键定位句。"}]}, {"id": "H", "full_en": "While these technologies are all promising ideas, they are either unproven or based on materials that are not abundant. In their overview of innovation in the concrete industry, Felix Preston and Johanna Lehne of the UK's Royal Institute of International Affairs reached the conclusion that, 'Some novel cements have been discussed for more than a decade within the research community, without breaking through. At present, these alternatives are rarely as cost-effective as conventional cement, and they face raw-material shortages and resistance from customers.'", "sentences": [{"en": "While these technologies are all promising ideas, they are either unproven or based on materials that are not abundant.", "cn": "尽管这些技术都很有前景，但它们要么尚未经充分验证，要么依赖并不丰富的原材料。", "grammar": "While 表让步；either...or...＝要么……要么……。"}, {"en": "In their overview of innovation in the concrete industry, Felix Preston and Johanna Lehne of the UK's Royal Institute of International Affairs reached the conclusion that, 'Some novel cements have been discussed for more than a decade within the research community, without breaking through.", "cn": "英国皇家国际事务研究所的费利克斯·普雷斯顿和约翰娜·莱纳在综述混凝土行业创新时得出结论：‘一些新型水泥已在研究界讨论了十多年，却始终没有取得实质突破。", "grammar": "reach the conclusion that＝得出结论；without breaking through＝未取得突破。"}, {"en": "At present, these alternatives are rarely as cost-effective as conventional cement, and they face raw-material shortages and resistance from customers.'", "cn": "目前，这些替代品很少能像传统水泥一样具有成本效益，而且还面临原料短缺及客户抵触。’", "grammar": "cost-effective＝有成本效益；resistance from customers＝客户抵触；Q12。"}]}], "questions": [{"n": 1, "kind": "section", "prompt": "an explanation of the industrial processes that create potential raw materials for concrete", "cn": "说明哪些工业过程产生了可用于混凝土的潜在原料。", "note": "an explanation of... = 对……的解释；that create... 是修饰 processes 的定语从句。"}, {"n": 2, "kind": "section", "prompt": "a reference to the various locations where high-rise wooden buildings can be found", "cn": "指出高层木建筑分布在哪些地点。", "note": "a reference to... = 提到……；locations where... 的 where 引导定语从句。"}, {"n": 3, "kind": "section", "prompt": "an indication of how widely available the raw materials of concrete are", "cn": "指出混凝土原料在世界范围内有多容易获得。", "note": "an indication of how... = 说明……的程度；widely available 说的是“容易获得”，而非“使用广泛”。"}, {"n": 4, "kind": "section", "prompt": "the belief that more high-rise wooden buildings are needed before wood can be regarded as a viable construction material", "cn": "认为需要更多高层木建筑的成功实例，才能将木材视为可行建材。", "note": "the belief that... 是同位语从句；before 表示“在……之前”；be regarded as = 被视为。"}, {"n": 5, "kind": "word", "prompt": "Wood is a traditional building material, but current environmental concerns are encouraging _____ to use wood in modern construction projects.", "cn": "气候担忧使更多______考虑在现代建筑中使用工程木材。", "note": "encourage sb. to do sth. = 鼓励／促使某人做某事；注意空格前后的词性搭配。"}, {"n": 6, "kind": "word", "prompt": "For example, as _____ in the atmosphere enters wood, it increases in size.", "cn": "木材吸收空气中的______后会膨胀。", "note": "as 可以表示“随着／当……时”；enters wood 是从空气进入木材。"}, {"n": 7, "kind": "word", "prompt": "In one process, _____ of solid wood are glued together to create building blocks.", "cn": "交叉层压木材通过将数______实木粘合制成。", "note": "are glued together 是被动语态；to create 表示制作这种构件的目的。"}, {"n": 8, "kind": "word", "prompt": "Experts say that wooden buildings are an improvement on those made of concrete and steel in terms of the _____ with which they can be constructed and how much noise is generated by the process.", "cn": "木结构建筑可能在施工______和噪声控制两方面有优势。", "note": "in terms of = 就……而言；with which 引导定语从句；how much noise 与前一比较并列。"}, {"n": 9, "kind": "person", "prompt": "The environmental advantage of cement alternatives may not be as great as initially assumed.", "cn": "用废料替代水泥未必一定带来显著的总体环境收益。", "note": "may not be as ... as ... 表示“未必像……那么……”；initially assumed = 最初设想的。"}, {"n": 10, "kind": "person", "prompt": "It would be hard to create a construction alternative to concrete that offers so many comparable benefits.", "cn": "制造一种同时具备混凝土多种优点的替代材料会很困难。", "note": "It would be hard to... 是评价难度的句式；comparable benefits = 可比的优势。"}, {"n": 11, "kind": "person", "prompt": "Worries about the environment have led to increased interest in wood as a construction material.", "cn": "环境担忧是全球木结构建筑需求增长的重要原因。", "note": "have led to = 导致；increased interest in = 对……的兴趣上升。"}, {"n": 12, "kind": "person", "prompt": "Expense has been a factor in the negative response to the development of new cements.", "cn": "新型水泥成本较高，是其难以被市场接受的因素之一。", "note": "has been a factor in = 是……的因素之一；negative response = 消极反应。"}, {"n": 13, "kind": "person", "prompt": "The environmental damage caused by concrete is due to it being produced in large quantities.", "cn": "混凝土的巨大碳排放影响主要源自生产和使用规模庞大。", "note": "is due to = 是由于；being produced 是被动动名词结构；in large quantities = 大量地。"}], "summary": ["Wood is a traditional building material, but current environmental concerns are encouraging [5] ____ to use wood in modern construction projects.", "Using wood, however, has its challenges.", "For example, as [6] ____ in the atmosphere enters wood, it increases in size.", "In addition, wood is prone to pests and the risk of fire is greater.", "However, wood can be turned into a better construction material if it is treated and combined with other materials.", "In one process, [7] ____ of solid wood are glued together to create building blocks.", "These blocks are lighter than concrete and steel but equal them in strength.", "Experts say that wooden buildings are an improvement on those made of concrete and steel in terms of the [8] ____ with which they can be constructed and how much noise is generated by the process."], "summary_cn": ["木材是一种传统建筑材料，但当 <script>
(()=>{'use strict';
const D=JSON.parse(document.getElementById('study-data').textContent),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=new Map(D.dictionary.map(v=>[v.en.toLowerCase(),v]));
const phraseList=[...words.keys()].sort((a,b)=>b.length-a.length);
const matcher=new RegExp('\\b(?:'+phraseList.join('|')+')\\b','gi');
let state={show:{},lookups:[]};try{let s=JSON.parse(localStorage.getItem('ielts-concrete-inline-reading-v1'));if(s&&typeof s==='object')state={...state,...s}}catch(_){}
const persist=()=>{try{localStorage.setItem('ielts-concrete-inline-reading-v1',JSON.stringify(state))}catch(_){}};
function markup(s){const str=String(s||'');let result='',last=0;matcher.lastIndex=0;for(const m of str.matchAll(matcher)){const pos=m.index;result+=esc(str.slice(last,pos));const e=words.get(m[0].toLowerCase());if(e)result+='<button type="button" class="word" data-word="'+esc(e.en)+'" title="点击查词">'+esc(m[0])+'</button>';else result+=esc(m[0]);last=pos+m[0].length}return result+esc(str.slice(last))}
function speak(s){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(s));u.lang='en-US';u.rate=.87;let v=window.speechSynthesis.getVoices();u.voice=v.find(x=>x.lang.toLowerCase()==='en-us')||v.find(x=>x.lang.toLowerCase().startsWith('en'))||null;window.speechSynthesis.speak(u)}
function define(word){const item=words.get(word.toLowerCase());if(!item)return;const b=$('dict-body');b.innerHTML='<div class="dict-word">'+esc(item.en)+'</div>'+(item.ipa?'<div class="dict-ipa">'+esc(item.ipa)+'</div>':'')+'<div class="dict-meaning">'+esc(item.cn)+'</div>'+(item.note?'<div class="dict-note">'+esc(item.note)+'</div>':'')+'<div class="dict-actions"><button id="dict-speak">🔊 美式发音</button></div><div class="mini-tip">继续点击其他单词即可切换释义。</div>';$('dict-speak').onclick=()=>speak(item.en);$('dictionary').classList.add('shown');document.querySelectorAll('.word.selected').forEach(x=>x.classList.remove('selected'));document.querySelectorAll('.word').forEach(x=>{if(x.dataset.word.toLowerCase()===word.toLowerCase())x.classList.add('selected')});state.lookups=[word,...state.lookups.filter(x=>x!==word)].slice(0,30);persist()}
document.addEventListener('click',e=>{let w=e.target.closest('[data-word]');if(w){define(w.dataset.word);return}let sp=e.target.closest('[data-speak]');if(sp){speak(sp.dataset.speak);return}let cv=e.target.closest('[data-toggle]');if(cv){const id=cv.dataset.toggle;state.show[id]=!state.show[id];persist();const panel=$(id);if(panel){panel.classList.toggle('hide',!state.show[id]);cv.textContent=state.show[id]?'收起精读':'译文与句法'}return}});
$('dict-close').onclick=()=>$('dictionary').classList.remove('shown');
function renderArticle(){let out='';for(const s of D.sections){const detailId='detail'+s.id;out+='<section class="article-card" id="section-'+s.id+'"><div class="section-bar"><div class="secletter">'+s.id+'</div><div class="secaction"><button class="control" data-speak="'+esc(s.full_en)+'">🔊 朗读</button><button class="control" data-toggle="'+detailId+'">'+(state.show[detailId]?'收起精读':'译文与句法')+'</button></div></div><div class="passage" lang="en">'+markup(s.full_en)+'</div><div class="close-read '+(state.show[detailId]?'':'hide')+'" id="'+detailId+'"><div class="close-title">逐句理解</div>'+s.sentences.map(x=>'<div class="annotation"><div class="ann-en" lang="en">'+markup(x.en)+'</div><div class="ann-cn">'+esc(x.cn)+'</div><div class="ann-grammar">'+esc(x.grammar)+'</div></div>').join('')+'</div></section>'}
$('article-content').innerHTML=out}
function renderQuestions(){const sectionQ=D.questions.filter(x=>x.n<=4),wordQ=D.questions.filter(x=>x.n>=5&&x.n<=8),personQ=D.questions.filter(x=>x.n>=9);
const card=q=>'<article class="question-card"><div class="question-top"><div class="qnumber">'+q.n+'</div><div style="flex:1"><p class="q-en" lang="en">'+markup(q.prompt)+'</p><p class="q-cn">'+esc(q.cn)+'</p><div class="q-note">句型：'+esc(q.note)+'</div></div></div></article>';
let out='<section class="qgroup"><h2 class="group-title">Questions 1–4</h2><p class="group-sub" lang="en">Reading Passage 1 has eight sections, A–H.<br>Which section contains the following information?</p><div class="options-line">'+[...'ABCDEFGH'].map(a=>'<span class="letter">'+a+'</span>').join('')+'</div><div style="height:24px"></div>'+sectionQ.map(card).join('')+'</section>';
out+='<section class="qgroup"><h2 class="group-title">Questions 5–8</h2><p class="group-sub" lang="en">Complete the summary below.<br>Choose ONE WORD ONLY from the passage for each answer.</p><div class="study-summary"><div style="font-weight:750;font-size:21px;margin-bottom:18px">Making buildings with wood</div><div class="summary-en" lang="en">'+D.summary.map(s=>'<p class="summary-line">'+markup(s).replace(/\[(\d+)\] ____/g,(_,n)=>'<span class="blank">'+n+'. ______</span>')+'</p><p class="summary-cn">'+esc(D.summary_cn[D.summary.indexOf(s)])+'</p>').join('')+'</div></div></section>';
out+='<section class="qgroup"><h2 class="group-title">Questions 9–13</h2><p class="group-sub" lang="en">Look at the following statements (Questions 9–13) and the list of people below.<br>Match each statement with the correct person, A, B, C or D.<br>NB You may use any letter more than once.</p><div class="people-block"><div style="font-size:21px;font-weight:750">List of People</div><div class="personlist">'+D.people.map(p=>'<div class="person"><div class="personhead"><div class="person-id">'+p.id+'</div><div class="name" lang="en">'+markup(p.name)+'</div></div><div class="subtitle">'+esc(p.desc)+'</div></div>').join('')+'</div></div>'+personQ.map(card).join('')+'</section>';
$('question-content').innerHTML=out}
function renderVocab(query=''){let q=query.trim().toLowerCase(),list=D.dictionary.filter(v=>(v.en+' '+v.cn).toLowerCase().includes(q));$('wordcount').textContent='· '+list.length+' 词组';$('vocab-grid').innerHTML=list.map(v=>'<div class="vocab-card"><div class="vword">'+esc(v.en)+'</div>'+(v.ipa?'<div class="vipa">'+esc(v.ipa)+'</div>':'')+'<div class="vmeaning">'+esc(v.cn)+'</div><button class="control" style="margin-top:12px" data-speak="'+esc(v.en)+'">🔊 发音</button></div>').join('')}
$('search').addEventListener('input',e=>renderVocab(e.target.value));
document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{const p=x.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===x));document.querySelectorAll('.page').forEach(b=>b.classList.toggle('active',b.id===p));window.scrollTo({top:0,behavior:'smooth'})});
$('lead').innerHTML=markup(D.subtitle);renderArticle();renderQuestions();renderVocab();
})();
</script></body></html>
